# Production stack: Payload CMS + PostgreSQL
# Run on the VPS from the project root:  docker compose up -d --build

services:
  payload:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    container_name: payload-cms
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      # Bound to localhost only. aaPanel Nginx proxies the public domain to this port.
      # Docker bypasses the aaPanel/UFW firewall if you publish on 0.0.0.0, so keep 127.0.0.1.
      - "127.0.0.1:${PAYLOAD_PORT:-3001}:3000"
    volumes:
      - payload_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - payload_net

  postgres:
    image: postgres:16-alpine
    container_name: payload-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No public port. Uncomment the next two lines only if you need to connect
    # with a DB client through an SSH tunnel.
    # ports:
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payload_net

volumes:
  postgres_data:
  payload_media:

networks:
  payload_net:
